# ── ناکامی، به ترتیبِ رسیدن ─────────────────────────────────
#
# ترتیب این پیام‌ها مهم است و در کد هم همان است: نخست «نبود»،
# بعد صدای ویدیو، بعد «سایت‌ها را می‌گردم»، بعد پیش‌نمایش‌ها، و
# در پایان «متأسفم» با دکمه‌ها. هیچ‌کدام نباید به جای دیگری
# بنشیند — پیش‌تر پیام پایانی اول می‌آمد و همه‌چیز وارونه بود.

search_asking_sites: |
  🌐 <b>در اینترنت می‌گردم…</b>

  <i>چند لحظه صبر کنید.</i>

# پایانِ کار، وقتی نه آرشیو چیزی داشت و نه سایت‌ها.
#
# این، زیرنویسِ خودِ صوتِ کلیپ کاربر است — پس کوتاه نگهش دارید:
# تلگرام زیرنویس را تا ۱۰۲۴ نویسه می‌پذیرد.
search_sorry: |
  🙏 <b>پیدا نکردم</b> — این صدای کلیپ خودتان است.

  📨 برای مدیران فرستادم؛ پیدا شد، همین‌جا می‌آید.
  <b>سکه‌ای کم نشد.</b>

# همان پیام، وقتی چیزی برای پیوست کردن نیست — یعنی خودِ کاربر
# صوت فرستاده بوده و از پیش داردش.
search_sorry_no_clip: |
  🙏 <b>پیدا نکردم</b>

  📨 برای مدیران فرستادم؛ پیدا شد، همین‌جا می‌آید.
  <b>سکه‌ای کم نشد.</b>

