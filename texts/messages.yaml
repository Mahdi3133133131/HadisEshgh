broadcast_ask: |
  📢 <b>همگانی‌رسانی</b>

  اکنون آنچه را می‌خواهید برای همه فرستاده شود بفرستید.
  نوشتار، عکس، آوا، نماهنگ — هر گونه‌ای.

  شمار دریافت‌کنندگان: <b>{count}</b>

broadcast_started: |
  📢 همگانی‌رسانی آغاز شد.
  شمار دریافت‌کنندگان: <b>{count}</b>

  <i>پیام‌ها آهسته فرستاده می‌شوند تا ربات مسدود نگردد.</i>

broadcast_progress: |
  📢 <b>در حال فرستادن…</b>

  پیشرفت: <b>{done}</b> از <b>{total}</b>
  رسید: <b>{sent}</b> · نرسید: <b>{failed}</b>

broadcast_finished: |
  ✅ <b>همگانی‌رسانی پایان یافت</b>

  رسید: <b>{sent}</b>
  نرسید: <b>{failed}</b>
  همه: <b>{total}</b>

broadcast_already_running: |
  📢 همگانی‌رسانی دیگری هم‌اکنون در جریان است.
  تا پایان آن درنگ کنید.

broadcast_no_targets: |
  🌿 هنوز همراه تأییدشده‌ای نیست که پیام برایش فرستاده شود.


