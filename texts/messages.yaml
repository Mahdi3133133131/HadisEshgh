feedback_ask: |
  ✍️ <b>خوشحال می‌شویم حرفتان را بشنویم</b>

  هر نقد، پیشنهاد یا سؤالی دارید بنویسید.
  متن، عکس، صدا، ویدیو — هر جور که راحت‌ترید.

feedback_unsupported: |
  🌿 این نوع فایل را نمی‌توانیم قبول کنیم.
  متن، عکس، صدا یا ویدیو بفرستید.

feedback_received: |
  ✅ <b>پیامتان رسید</b>

  برای مدیران فرستاده شد.
  اگر جوابی باشد، همین‌جا به شما می‌رسانیم.

  ممنون از توجهتان. 🌿

feedback_group_header: |
  ✍️ <b>سخن تازه‌ای رسید</b>

  <b>فرستنده:</b> {name}
  <b>نام‌کاربری:</b> {username}
  <b>شناسه:</b> <code>{user_id}</code>
  <b>شمارهٔ سخن:</b> <code>{feedback_id}</code>

feedback_answer_header: |
  ✍️ <b>پاسخ گردانندگان به سخن شما</b>

feedback_answer_sent: "✅ پاسخ شما به همراه رسید و قفل رها شد."

feedback_locked: |
  گردانندهٔ دیگری هم‌اکنون در حال پاسخ‌گویی به این سخن است.
  اندکی درنگ کنید یا سخن دیگری را برگزینید.

feedback_lock_taken: |
  🔒 <b>{admin}</b> پاسخ‌گویی این سخن را بر عهده گرفت.
  <i>مهلت: {minutes} دقیقه</i>

feedback_user_blocked: |
  🌿 این همراه ربات را مسدود کرده است؛ پاسخ به او نرسید.


