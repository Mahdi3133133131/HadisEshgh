# ───────────────────────────────────────────────────────────────
#  گمانهٔ نواهای همانند
#
#  این‌ها آنگاه گفته می‌شوند که اثر انگشت چیزی نیافت. لحن باید
#  روشن کند که گمانه است نه پاسخ — وگرنه کاربر می‌پندارد ربات
#  یافته و اشتباه کرده، حال آنکه ربات از آغاز گفته «شاید».
# ───────────────────────────────────────────────────────────────
search_similar_header: |
  🌿 <b>شاید یکی از این‌ها باشد</b>

