error_generic: |
  🌿 شرمنده؛ در انجام این کار مشکلی پیش آمد.
  کمی صبر کنید و دوباره امتحان کنید.

error_banned: |
  دسترسی شما به این ربات بسته شده است.

admin_only: "این دستور فقط مال مدیران است."

cancelled: "🌿 باشد، بی‌خیال شدیم."

# ───────────────────────────────────────────────────────────────
#  مدیریت کانال‌ها — دو فهرست جدا
#
#  «عضویت اجباری»: کاربر باید در همه‌شان عضو باشد. برای تبلیغ.
#  «منبع»: کانال‌های مداحی که ربات در آن‌ها هم می‌گردد.
# ───────────────────────────────────────────────────────────────
channel_ask_required: |
  🔗 <b>کانال تازه برای عضویت اجباری</b>

  کاربران باید در این کانال عضو شوند تا بتوانند از ربات استفاده
  کنند.

  <b>یکی از این سه شکل را بفرستید:</b>

  <code>@nemune_channel</code>

  یا

  <code>https://t.me/nemune_channel</code>

  یا اگر کانال خصوصی است، شناسه و لینک را با هم:

  <code>-1002777571203
  https://t.me/+AbCdEfGh</code>

  ⚠️ <b>ربات باید در آن کانال مدیر باشد</b>، وگرنه نمی‌تواند
  عضویت کاربران را بررسی کند. اول ربات را آنجا مدیر کنید، بعد
  این دستور را بزنید.

channel_ask_source: |
  🎧 <b>کانال مداحی تازه</b>

  هر فایلی که در این کانال گذاشته شود، خودکار وارد آرشیو ربات
  می‌شود و کاربران می‌توانند پیدایش کنند.

  <b>یکی از این سه شکل را بفرستید:</b>

  <code>@nemune_channel</code>

  یا

  <code>https://t.me/nemune_channel</code>

  یا برای کانال خصوصی:

  <code>-1002777571203
  https://t.me/+AbCdEfGh</code>

  ⚠️ <b>ربات باید در آن کانال مدیر باشد</b> تا پست‌ها به دستش
  برسد.

channel_bad_input: |
  🌿 چیزی که فرستادید نه شناسه بود و نه لینک.

  یک نمونه: <code>@nemune_channel</code>

  دوباره دستور را بزنید.

channel_not_found: |
  🌿 <b>این کانال پیدا نشد</b>

  <i>{error}</i>

  دو چیز را بررسی کنید: شناسه یا نام درست باشد، و ربات از آن
  کانال بیرون انداخته نشده باشد.

channel_not_admin: |
  🌿 <b>ربات در «{title}» مدیر نیست</b>

  اول ربات را در آن کانال مدیر کنید، بعد دوباره این دستور را
  بزنید.

  <i>بدون مدیر بودن، نه می‌تواند عضویت را بررسی کند و نه
  پست‌های تازه به دستش می‌رسد.</i>

channel_need_link: |
  🌿 این کانال نام‌کاربری عمومی ندارد، پس لینک دعوتش را هم لازم
  دارم.

  شناسه و لینک را با هم بفرستید:

  <code>-1002777571203
  https://t.me/+AbCdEfGh</code>

channel_added: |
  ✅ <b>«{title}» به فهرست {kind} افزوده شد</b>

  شناسه: <code>{chat_id}</code>

channel_already: |
  🌿 «{title}» از قبل در فهرست {kind} هست.

channel_source_note: |
  <i>یادآوری: ربات نمی‌تواند پست‌های <b>قدیمی</b> کانال را بخواند —
  این محدودیت خود تلگرام است. از همین لحظه به بعد هر فایل تازه‌ای
  که آنجا گذاشته شود وارد آرشیو می‌شود.</i>

channel_list_required: "🔗 <b>کانال‌های عضویت اجباری</b>"

channel_list_source: "🎧 <b>کانال‌های مداحی</b>"

