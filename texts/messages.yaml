# ═══════════════════════════════════════════════════════════════
#  حدیث عشق — گنجینهٔ پیام‌ها
#
#  همهٔ نوشتارهایی که ربات به کاربر می‌گوید در همین پرونده است.
#  برای دگرگون کردن سخنی، هیچ نیازی به دست بردن در کد نیست.
#
#  راهنما:
#    • {name} و {tokens} و مانند آن، جای‌گاه مقدارند و باید
#      دست‌نخورده بمانند، وگرنه پیام فرستاده نمی‌شود.
#    • نشانه‌گذاری پیام‌ها HTML است: <b>، <i>، <code>، <a href="">
#    • برای چند سطر، از | بهره بگیرید (شکل کنونی).
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
#  خوش‌آمد و آستانهٔ ورود
# ───────────────────────────────────────────────────────────────
welcome: |
  <b>بِسْمِ اللهِ الرَّحْمٰنِ الرَّحیم</b>

  {name} عزیز، خوش آمدید. 🌿

  اینجا <b>حدیث عشق</b> است؛ آرشیوی از مداحی‌های اهل بیت علیهم‌السلام.

  <b>کار ربات ساده است:</b> یک تکه از هر مداحی را بفرستید — صدا،
  ویدیو، یا لینک اینستاگرام — تا فایل کاملش را پیدا کنم و برایتان
  بفرستم.

  <b>برای شروع، دو کار کوچک:</b>
  ۱. در کانال ما عضو شوید
  ۲. روی دکمهٔ صفحهٔ اینستاگرام بزنید

  بعد دکمهٔ <b>بررسی عضویت</b> را بزنید.

welcome_back: |
  {name} عزیز، دوباره خوش آمدید. 🌿

  از منوی پایین هر چه خواستید انتخاب کنید.

not_verified: |
  🌿 <b>هنوز کامل نشده</b>

  {reasons}

  بعد از انجامشان، دوباره دکمهٔ <b>بررسی عضویت</b> را بزنید.

not_verified_reason_channel: "• هنوز در کانال ما عضو نشده‌اید."

# وقتی چند کانال اجباری هست، نام هرکدام که مانده گفته می‌شود —
# وگرنه کاربر نمی‌داند کدام را باید عضو شود.
not_verified_reason_one: "• هنوز در «{title}» عضو نشده‌اید."
not_verified_reason_instagram: "• هنوز روی دکمهٔ صفحهٔ اینستاگرام نزده‌اید."

verified: |
  ✅ <b>تأیید شد</b>

  {name} عزیز، خوش آمدید.

  الان <b>{tokens} سکه</b> در کیسه‌تان دارید؛ با هر سکه یک جست‌وجو.

  از منوی پایین استفاده کنید. 🌿

# گزارش کاربر تازه به گروه کاربران. شناسه در <code> است تا با
# یک ضربه رونویسی شود — گردانندگان با همین عدد /trust می‌زنند.
user_joined: |
  🌿 <b>کاربر تازه</b>

  <b>نام:</b> {name}
  <b>نام‌کاربری:</b> {username}
  <b>شناسه:</b> <code>{user_id}</code>

  <i>عضویتش تأیید شد و {tokens} سکه گرفت.</i>

instagram_tapped: |
  🌿 ممنون. حالا در کانال ما هم عضو شوید و بعد دکمهٔ
  <b>بررسی عضویت</b> را بزنید.

left_channel: |
  🌿 <b>عضویتتان در کانال برقرار نیست</b>

  برای استفاده از ربات باید عضو کانال بمانید.
  دوباره عضو شوید و <code>/start</code> بزنید.

must_verify_first: |
  🌿 برای استفاده از این بخش، اول باید عضویتتان تأیید شود.
  دستور /start را بفرستید.

# ───────────────────────────────────────────────────────────────
#  منوی اصلی
# ───────────────────────────────────────────────────────────────
main_menu: |
  🌿 <b>حدیث عشق</b>

  کاربران: <b>{user_count}</b>
  مداحی‌های آرشیو: <b>{track_count}</b>

  چه کاری برایتان بکنم؟

help: |
  🌿 <b>راهنمای حدیث عشق</b>

  🔍 <b>پیدا کردن مداحی</b>
  تکه‌ای صدا یا ویدیو بفرستید — یا اسم مداح را بنویسید.
  <i>پیدا شد یک سکه؛ نشد، رایگان.</i>

  🎁 <b>فرستادن مداحی</b>
  مداحی‌ای که نداریم را بفرستید — پس از تأیید، یک سکه.

  ✍️ <b>نظر و پیشنهاد</b> · 🪙 <b>کیسهٔ سکه</b> · 🎤 <b>مداحان</b>

  <i>اولِ کار {initial} سکه هدیه می‌گیرید. اگر فایل اشتباه آمد و
  «این نیست» زدید، سکه‌تان برمی‌گردد.</i>

  🌿 التماس دعا

# ───────────────────────────────────────────────────────────────
#  کیسهٔ سکه
# ───────────────────────────────────────────────────────────────
invite_block: |
  ━━━━━━━━━━━━━━━━━━━━
  🎁 <b>هر همراهی که بیاورید، {reward} سکه</b>

  لینک اختصاصی شما:
  <code>{link}</code>

  <i>هر کس با این لینک ربات را آغاز کند و عضو کانال شود، {reward}
  سکه به شما می‌رسد — یک بار برای هر نفر.</i>

  تا کنون آورده‌اید: <b>{brought}</b> نفر

invite_rewarded: |
  🎁 <b>{coins} سکه گرفتید</b>

  <b>{name}</b> با لینک شما آمد و عضو شد.

  کیسهٔ شما: <b>{tokens}</b> سکه

  <i>سپاس که گنجینه را بزرگ می‌کنید. 🌿</i>

token_balance: |
  🪙 <b>کیسهٔ سکهٔ شما</b>

  موجودی: <b>{tokens}</b> سکه

  <b>سکه یعنی چه؟</b>
  پیدا کردن هر مداحی برای ربات پردازش و زمان می‌برد. سکه فقط
  همان را می‌شمارد، نه بیشتر.

  <b>کِی کم می‌شود</b>
  • فقط وقتی مداحی <b>پیدا شود و برایتان فرستاده شود</b> — یک سکه.

  <b>کِی کم نمی‌شود</b>
  • جست‌وجوی ناموفق: رایگان است.
  • «❌ این نیست»: سکه‌تان <b>برمی‌گردد</b>؛ اشتباه از ما بوده.

  <b>چطور سکه بگیرید</b>
  • مداحی‌ای که در آرشیو ما نیست بفرستید؛ با تأیید مدیران
    <b>یک سکه</b> می‌گیرید.

  {history}

token_history_empty: "<i>هنوز چیزی رد و بدل نشده.</i>"
token_history_title: "<b>آخرین تغییرها:</b>"

token_empty: |
  🪙 <b>کیسهٔ سکهٔ شما</b>

  موجودی: <b>{tokens}</b> سکه

  کیسه خالی است، ولی راه بسته نیست:

  • <b>فرستادن مداحی</b> — مداحی‌ای که در آرشیو ما نیست بفرستید؛
    با تأیید مدیران یک سکه می‌گیرید.

  {history}

token_earned: |
  🎁 <b>سکه‌ای به شما پیشکش شد</b>

  نوای شما پذیرفته و به گنجینه افزوده گشت.
  موجودی کنونی: <b>{tokens}</b>

  سپاس از بخشندگی شما. 🌿

# ───────────────────────────────────────────────────────────────
#  پیشکش نوا
# ───────────────────────────────────────────────────────────────
submit_ask_file: |
  🎁 <b>ممنون که می‌خواهید مداحی‌ای را با ما به اشتراک بگذارید</b>

  حالا فایل صوتی را بفرستید.

  <i>نکته: فقط فایل صوتی (mp3) قبول می‌شود. پیام صوتی ضبط‌شده به
  درد آرشیو نمی‌خورد، چون کیفیت صدا را خیلی پایین می‌آورد.</i>

submit_only_audio: |
  🌿 چیزی که فرستادید فایل صوتی نبود.
  لطفاً مداحی را به صورت فایل صوتی بفرستید.

submit_no_voice: |
  🌿 پیام صوتی ضبط‌شده برای آرشیو مناسب نیست، چون کیفیت صدا را
  پایین می‌آورد.

  لطفاً خود فایل صوتی را بفرستید.

# تنها پرسشِ پیشکش. نام مداح و اسم مداحی از خودِ فایل خوانده
# شده‌اند؛ اگر فایل برچسب نداشته باشد «—» می‌شوند و کاربر در
# گام ویرایش پرشان می‌کند.
submit_ask_style_tags: |
  🎼 <b>سبک این مداحی چیست؟</b>

  <b>نام مداح:</b> {madah}
  <b>اسم مداحی:</b> {title}

  <i>این‌ها را از روی خود فایل خواندم. اگر غلط است، مرحلهٔ بعد
  می‌توانید اصلاحش کنید.</i>

submit_ask_style: |
  🌿 <b>سبک</b> این مداحی چیست؟

  از گزینه‌های پایین انتخاب کنید، یا اگر سبک دیگری است خودتان
  بنویسید.

submit_received: |
  ✅ <b>مداحی شما رسید</b>

  برای بررسی نزد مدیران فرستاده شد.
  اگر تأیید شود، <b>یک سکه</b> می‌گیرید و خبرتان می‌کنیم.

  ممنون از لطفتان. 🌿

upload_started: |
  🌿 <b>بارگذاری دسته‌ای روشن شد</b>

  نواها را پشت هم بفرستید. هر کدام که تازه باشد، یک سکه برایتان
  می‌نشیند.

  پایان که کارتان تمام شد: <code>/done</code>

  <i>تا وقتی روشن است، آوایی که می‌فرستید جست‌وجو نمی‌شود.</i>

upload_private_only: |
  🌿 این فرمان تنها در گفتگوی خصوصی کار می‌کند.

upload_trusted_only: |
  🌿 <b>این فرمان برای همراهانِ مورد اعتماد است.</b>

  <i>اگر می‌خواهید نوایی بفرستید، از دکمهٔ «پیشکش نوا» بروید.</i>

trusted_batch_done: |
  🌿 <b>بارگذاری تمام شد</b>

  • نشست در گنجینه: <b>{added}</b>
  • تکراری بود و رد شد: <b>{skipped}</b>

  کیسهٔ سکه‌تان: <b>{tokens}</b>

submit_checking: |
  🌿 <b>دارم نگاه می‌کنم…</b>

  <i>می‌بینم این نوا از پیش در گنجینه هست یا نه.</i>

submit_duplicate: |
  🌿 این مداحی از قبل در آرشیو ما هست:
  «<b>{title}</b>»

  با این حال، ممنون از زحمتتان.

submit_duplicate_admin: |
  🌿 مداحی‌ای که فرستادید از قبل در آرشیو بود؛ برای همین سکه‌ای
  اضافه نشد.

  ممنون از زحمتتان.

submit_rejected: |
  🌿 <b>شرمنده</b>

  مداحی‌ای که فرستادید از طرف مدیران تأیید نشد.

  شاید با چیزی که در آرشیو دنبالش هستیم جور نبوده.
  به هر حال ممنون از همراهی‌تان.

