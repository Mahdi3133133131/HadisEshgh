# ───────────────────────────────────────────────────────────────
#  دفتر پذیرش — نوایی که گرداننده می‌افزاید
# ───────────────────────────────────────────────────────────────
# سرنویسِ هر گامِ پذیرش — روی **همهٔ** پرسش‌ها می‌نشیند، نه فقط
# اولی. بی این، گرداننده از گام «سبک» به بعد نمی‌داند دربارهٔ کدام
# فایل حرف می‌زند.
intake_header_many: "🎧 <b>مداحی {index} از {total}</b> · <i>{name}</i>"

intake_header_one: "🎧 <i>{name}</i>"

# تنها پرسشِ پذیرش. نام مداح و اسم مداحی از برچسب خودِ فایل
# خوانده شده‌اند و همین‌جا نشان داده می‌شوند تا اگر غلط بودند،
# گرداننده همان لحظه ببیند.
intake_ask_style_known: |
  🎼 <b>سبکش چیست؟</b>

  {madah} · {title}

intake_ask_style: |
  🌿 <b>سبک</b> این نوا کدام است؟

  <i>می‌توانید از دکمه‌ها برگزینید یا خودتان بنویسید.</i>

# هشدارِ «این نوحه از پیش هست» — همراه با خودِ نوای موجود.
#
# لحنش گمانه‌زن است نه قطعی: خطِ آهنگ شباهت را می‌گوید، نه یکی
# بودن را. تصمیم با گرداننده است، پس پیام باید کمکش کند نه اینکه
# جایش تصمیم بگیرد.
# پیش از پرسش‌های هر نوا، خودش بازفرستاده می‌شود — تا در دسته‌ای
# بیست‌تایی، گرداننده دنبال فایل نگردد.
intake_now_this: |
  🎧 <b>نوبت این است</b>  ·  <i>{left} تا مانده</i>

screen_started: |
  🔍 <b>نخست می‌سنجم کدامشان را از پیش داریم…</b>

  <i>{count} فایل. پرسش‌ها پس از این می‌آید.</i>

screen_ask: |
  ⚠️ <b>این را از پیش داریم — درست می‌گویم؟</b>

  <b>در گنجینه:</b> {madah} · {title}
  <b>شمارهٔ نوا:</b> <code>{track_id}</code>
