# ───────────────────────────────────────────────────────────────
classifier_untrained: |
  🌿 <b>گمانه‌زن هنوز آموزش ندیده است</b>

  برای آموزش، دست‌کم سه نوای برچسب‌خورده از هر مداح یا سبک
  بایسته است.

  هرچه گنجینه پربارتر شود، گمانه‌ها استوارتر می‌گردند.

classifier_trained: |
  ✅ <b>گمانه‌زن آموزش دید</b>

  مداحان شناخته‌شده: <b>{madah}</b>
  سبک‌های شناخته‌شده: <b>{style}</b>
  نمونه‌های به‌کاررفته: <b>{samples}</b>

  <i>یادآوری: این لایه گمانه می‌زند، نه یافتن قطعی. یافتن، کار
  اثر انگشت است.</i>


# ───────────────────────────────────────────────────────────────
#  پرسش نام مداح
#
#  دو بار پرسیده می‌شود و بی‌سبب نیست: بار نخست پیش از جست‌وجو،
#  چون اگر کاربر نام را بداند کار ما آسان‌تر می‌شود؛ بار دوم تنها
#  اگر بار نخست «نمی‌دانم» زده باشد و اثر انگشت هم نیافته باشد —
#  آنگاه نام، واپسین راه است.
# ───────────────────────────────────────────────────────────────
search_ask_hint: |
  🌿 <b>قبل از جست‌وجو، یک سؤال</b>

  اگر <b>نام مداح</b> را می‌دانید، یا یک تکه از متنی که در این
  مداحی خوانده می‌شود به یادتان مانده، همین‌جا بنویسید.

  <i>لازم نیست، ولی خیلی کمک می‌کند. اگر نمی‌دانید دکمهٔ پایین را
  بزنید تا همین حالا بگردم.</i>

search_ask_hint_after_fail: |
  🌿 <b>نام مداح یادتان هست؟</b> بنویسید تا با اسم بگردم.

  <i>پیدا شد یک سکه کم می‌شود؛ درست نبود، با «این آن نیست»
  برمی‌گردد.</i>

search_hint_saved: "🌿 ممنون. دارم می‌گردم…"


# ───────────────────────────────────────────────────────────────
#  گمانهٔ نواهای همانند — دنبالهٔ بخش پیشین
# ───────────────────────────────────────────────────────────────
search_similar_read: |
  🌿 <b>از صدای شما این‌ها را فهمیدم</b>

search_read_madah: "<b>صدا:</b> شاید {madah} ({percent}٪)"
search_read_style: "<b>سبک:</b> شاید {style}"
search_read_tempo: "<b>ضرب:</b> {tempo}"

# ───────────────────────────────────────────────────────────────
#  نام نوا (بیت شعر)
# ───────────────────────────────────────────────────────────────
# ───────────────────────────────────────────────────────────────
#  همراه مورد اعتماد
# ───────────────────────────────────────────────────────────────
submit_trusted_received: |
  ✅ <b>مداحی شما مستقیم به آرشیو رفت</b>

  مدیران به شما اعتماد کرده‌اند، برای همین فرستاده‌های شما دیگر
  منتظر بررسی نمی‌مانند.

  <b>یک سکه</b> گرفتید. موجودی: <b>{tokens}</b>

trusted_granted: |
  🤝 <b>اعتماد</b>

  از این پس پیشکش‌های <b>{name}</b> بی داوری یک‌راست به گنجینه
  می‌روند.

  <i>سنجش تکراری همچنان انجام می‌شود؛ اعتماد، پریدن از داوری است
  نه از آن نگهبان.</i>

trusted_revoked: |
  🌿 اعتماد به <b>{name}</b> پس گرفته شد؛ پیشکش‌هایش دگربار داوری
  می‌شوند.

trusted_user_notice: |
  🤝 <b>گردانندگان به شما اعتماد کردند</b>

  از این پس نواهایی که پیشکش می‌کنید، بی چشم‌به‌راهیِ داوری،
  یک‌راست به گنجینه می‌روند.

  <b>و یک راهِ تازه:</b> با <code>/upload</code> می‌توانید چند نوا را
  پشت هم بفرستید. هر کدام که تازه باشد، یک سکه برایتان می‌نشیند.
  پایانش <code>/done</code>.

  سپاس از همراهی شما. 🌿

trusted_group_notice: |
  ✅ <b>خودکار پذیرفته — از همراه مورد اعتماد</b>

  <b>مداح:</b> {madah}
  <b>سبک:</b> {style}
  <b>نام نوا:</b> {title}

  <b>پیشکش‌کننده:</b> {name}
  <b>شناسه:</b> <code>{user_id}</code>
  <b>شمارهٔ نوا:</b> <code>{track_id}</code>


# ───────────────────────────────────────────────────────────────
#  افزودن انبوه در گروه مداحی
# ───────────────────────────────────────────────────────────────
bulk_started: |
  📥 <b>افزودن انبوه آغاز شد</b>

  اکنون نواها را پشت سر هم بفرستید؛ همه گردآوری می‌شوند.

  {madah_line}
  <i>پس از «پایان افزودن»، شناسنامهٔ هر نوا را یکی‌یکی می‌پرسم و
  تا تأیید نکنید چیزی در گنجینه نمی‌نشیند.</i>

  <i>برای پایان، دکمهٔ زیر را بنوازید یا /bulk_end را بفرستید.</i>

bulk_madah_line: "<b>مداح این دسته:</b> {madah}\n"

bulk_progress: |
  📥 <b>در حال گردآوری…</b>

  گرفته شد: <b>{added}</b>
  تکراری: <b>{duplicate}</b>

bulk_finished: |
  ✅ <b>گردآوری پایان یافت</b>

  آمادهٔ پذیرش: <b>{added}</b>
  تکراری بود: <b>{duplicate}</b>

  <i>اکنون شناسنامهٔ هر نوا را می‌پرسم. برای رها کردن، /cancel.</i>

bulk_none: |
  🌿 هیچ نوایی فرستاده نشد.

bulk_not_running: |
  🌿 افزودن انبوهی در جریان نیست. برای آغاز، /bulk را بفرستید.


# ───────────────────────────────────────────────────────────────
#  پرکردن بازجویی ناکام به دست گردانندگان
# ───────────────────────────────────────────────────────────────
fill_header: |
  🔍 <b>بازجویی ناکام</b>

  <b>جوینده:</b> {name}
  <b>نام‌کاربری:</b> {username}
  <b>شناسهٔ عددی:</b> <code>{user_id}</code>
  <b>شمارهٔ بازجویی:</b> <code>{search_id}</code>
  <b>درازای پاره:</b> {duration}
  <b>گمانهٔ خودِ جوینده:</b> {hint}

  <i>این نوا در گنجینه نبود. اگر نسخهٔ کاملش را دارید، دکمهٔ زیر را
  بنوازید تا هم برای او بفرستیم و هم به گنجینه بیفزاییم.</i>

fill_locked: |
  گردانندهٔ دیگری هم‌اکنون این بازجویی را بر عهده گرفته است.

fill_already_done: |
  این بازجویی پیش‌تر پر شده است.

fill_ask_audio: |
  📤 <b>{admin} پرکردن این بازجویی را بر عهده گرفت</b>

  اکنون نسخهٔ کامل را همین‌جا بفرستید.
  <i>مهلت: {minutes} دقیقه</i>

fill_delivered_to_user: |
  🌿 <b>آنچه می‌جستید یافت شد</b>

  گردانندگان ما نوایی را که پیش‌تر نیافته بودیم، برایتان یافتند.

  <b>مداح:</b> {madah}
  <b>سبک:</b> {style}

  <i>بابت این جست‌وجو یک سکه کم شد. اگر این آن نیست، بگویید
  تا برگردانم.</i>

fill_user_gone: |
  🌿 نوا به گنجینه افزوده شد، ولی به جوینده نرسید؛ چه بسا ربات را
  مسدود کرده است.

fill_hint_added: |
  🌿 <b>گمانهٔ تازه برای بازجویی</b> <code>{search_id}</code>

  جوینده افزود: <b>{hint}</b>

bulk_group_only: |
  🌿 افزودن مداحی در <b>گروه بایگانی</b> یا <b>گروه مداحی</b> کار
  می‌کند — نه در گفتگوی خصوصی.

  <i>هر دو گروه باز است تا دو نفر هم‌زمان ثبت کنند. در گفتگوی
  خصوصی، فایلی که می‌فرستید با جست‌وجو اشتباه گرفته می‌شود.</i>


# ───────────────────────────────────────────────────────────────
#  برداشتن نوا از گنجینه
#
#  برداشتن برگشت‌ناپذیر است، پس هر گام باید روشن بگوید چه چیزی
#  برداشته می‌شود. نام نواها به هم می‌مانند و یک نواختِ اشتباه،
#  نوای دیگری را می‌برد.
# ───────────────────────────────────────────────────────────────
delete_group_only: |
  🌿 برداشتن مداحی فقط در <b>گروه بایگانی</b> شدنی است.

  <i>جای دیگر، نامی که می‌نویسید به چشم جست‌وجو می‌آید نه برداشتن —
  و یک ضربه، مداحی‌ای را از آرشیو می‌برد.</i>

delete_ask_name: |
  🗑 <b>برداشتن نوا</b>

  نام مداح، یا بیتی از شعرِ نوایی که می‌خواهید بردارید بنویسید.

  <i>یا کوتاه‌تر: <code>/delete رسول برنا</code></i>

delete_none: |
  🌿 برای «<b>{term}</b>» نوایی در گنجینه نیافتیم.

  <i>شاید املای دیگری دارد. با <code>/stats</code> می‌بینید چند
  نوا در گنجینه هست.</i>

delete_pick: |
  🗑 برای «<b>{term}</b>» — <b>{count}</b> نوا یافتیم.

  کدام برداشته شود؟

delete_confirm: |
  ⚠️ <b>این نوا برداشته شود؟</b>

  <b>مداح:</b> {madah}
  <b>سبک:</b> {style}
  <b>نام:</b> {title}
  <b>زمان:</b> {duration}
  <b>شمارهٔ نوا:</b> <code>{track_id}</code>
  <b>عددهای اثر انگشت:</b> {hashes}

  <i>برداشتن برگشت‌ناپذیر است. خودِ فایل در تلگرام می‌ماند؛ آنچه
  برداشته می‌شود نشانی و اثر انگشتِ آن در گنجینهٔ ماست.</i>

delete_done: |
  🗑 <b>برداشته شد</b>

  {label}

  <i>به دست {admin}</i>

delete_gone: "این نوا دیگر در گنجینه نیست."


