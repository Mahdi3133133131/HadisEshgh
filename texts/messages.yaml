owner_only: |
  🌿 این کار تنها از دست <b>مالک</b> برمی‌آید.

  <i>مالک، نخستین شناسه در ADMIN_IDS است.</i>

admin_needs_id: |
  🌿 شناسهٔ عددی همراه را بنویسید:
  <code>/addadmin 123456789</code>

  <i>شناسه را با بازفرستادن پیامی از او به @userinfobot می‌یابید.</i>

admin_id_not_number: "🌿 شناسه باید عدد باشد."

admin_is_owner: |
  🌿 این شناسه از آنِ خودِ مالک است؛ گردانندگی‌اش همیشگی است.

admin_unknown_user: |
  🌿 چنین همراهی در دفتر نیست.

  <i>نخست باید یک بار به ربات <code>/start</code> بزند.</i>

admin_in_env: |
  🌿 این شناسه در پروندهٔ <code>.env</code> نوشته شده و از آنجا
  گرداننده است؛ از اینجا برداشتنی نیست.

  <i>برای برداشتنش، از ADMIN_IDS در <code>.env</code> بردارید و
  ربات را دگربار بیاغازید.</i>

admin_granted: |
  ✅ <b>{name}</b> از این پس گرداننده است.

admin_revoked: |
  ↩️ گردانندگی <b>{name}</b> پس گرفته شد.

admin_user_notice: |
  🛡 <b>شما گردانندهٔ حدیث عشق شدید</b>

