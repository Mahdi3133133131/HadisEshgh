# ═══════════════════════════════════════════════════════════════
#  حدیث عشق — برچسب‌ها (استیکر)
#
#  ── چگونه شناسهٔ یک برچسب را به دست آوریم؟ ──
#  برچسب دلخواه را برای ربات بفرستید؛ اگر ربات در حالت گردانندگی
#  باشد، شناسهٔ آن را بازمی‌گوید. یا از رباتی مانند @idstickerbot
#  بهره ببرید.
#
#  ── نکتهٔ مهم ──
#  برچسب در تلگرام همواره پیامی جداگانه است و به متن نمی‌چسبد.
#  اگر برای هر پیام برچسبی بفرستیم، شمار پیام‌ها دوچندان می‌شود و
#  حس درهم‌ریختگی می‌دهد. از این رو برچسب تنها در چند لحظهٔ کلیدی
#  فرستاده می‌شود — همان‌ها که در زیر آمده‌اند.
#
#  ── تهی گذاشتن ──
#  هر کلیدی که مقدارش تهی بماند، نادیده گرفته می‌شود و هیچ برچسبی
#  فرستاده نمی‌گردد. پس می‌توانید تدریجی پرشان کنید.
# ═══════════════════════════════════════════════════════════════

